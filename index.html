<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="ret.css">
    <title>RET</title>

</head>

<body>


    <div class="card-group">
        <div class="card">
          
          <div class="card-body">
            <h5 class="card-title">Scripts</h5>

       
  <br><br>

  <label>Nome do Titular: <input type="text" id="nomeTitular" onblur="registrarCampo(this, 'Nome do Titular')" /></label><br><br>

  <label>Titular está em linha? </label>
  <input type="text" id="Titularemlinha" onblur="registrarCampo(this, 'Titular está em linha')" /></label><br><br>

  <label>Confirmado dados e passou para ser tratado por: 
    <input type="text" id="tratadoPor" onblur="registrarCampo(this, 'Tratado por')" />
  </label><br><br>

  <label>Telefone no ato da ligação: 
    <input type="text" id="telefoneLigacao" onblur="registrarCampo(this, 'Telefone no ato da ligação')" />
  </label><br><br>

  <label>Plano que irá permanecer: 
    <input type="text" id="plano" onblur="registrarCampo(this, 'Plano')" />
  </label><br><br>

  <label>Desconto:</label>
  SIM <input type="radio" name="desconto" value="SIM / 10% () 20% () 30% () 50% () 70% () / 2 meses () 3 meses () 4 meses ()" onchange="registrarRadio('desconto', 'Desconto')" />
  NÃO <input type="radio" name="desconto" value="NÃO" onchange="registrarRadio('desconto', 'Desconto')" /><br><br>

  <label>Valor durante o desconto: <input type="text" id="valorDesconto" onblur="registrarCampo(this, 'Valor durante o desconto')" /></label><br><br>
  <label>Valor após o desconto: <input type="text" id="valorAposDesconto" onblur="registrarCampo(this, 'Valor após o desconto')" /></label><br><br>

  <label>Fidelidade: <input type="text" id="fidelidade" onblur="registrarCampo(this, 'Fidelidade')" /></label><br><br>
  <label>Produtos cancelados: <input type="text" id="produtosCancelados" onblur="registrarCampo(this, 'Produtos cancelados')" /></label><br><br>

  <label>Número portado:</label>
  SIM <input type="radio" name="numeroPortado" value="SIM" onchange="registrarRadio('numeroPortado', 'Número portado')" />
  NÃO <input type="radio" name="numeroPortado" value="NÃO" onchange="registrarRadio('numeroPortado', 'Número portado')" /><br><br>

  <label>Última fatura a receber? Se sim, qual o valor? <input type="text" id="ultimaFatura" onblur="registrarCampo(this, 'Última fatura')" /></label><br><br>

  <label>Multa contratual:</label>
  SIM <input type="radio" name="multa" value="SIM" onchange="registrarRadio('multa', 'Multa contratual')" />
  NÃO <input type="radio" name="multa" value="NÃO" onchange="registrarRadio('multa', 'Multa contratual')" />
  Se sim, qual o valor? <input type="text" id="valorMulta" onblur="registrarCampo(this, 'Valor da multa')" /><br><br>

  <label>Data de recolhimento dos equipamentos: <input type="date" id="dataRecolhimento" onchange="registrarCampo(this, 'Data de recolhimento')" /></label><br><br>

 
  
            
          </div>
        </div>
        <div class="card">
          
          <div class="card-body">
            <h5 class="card-title">Escala</h5>
            <br><br>
            <p>Migração de Plano</p>
    <p>Paramount, Deezer, Globoplay 90d</p>
    <p>Descontos % 10, 20, 30 , 50, 70</p>

    <br>

    <div class="faturas"> 

        <input class="d-inline-flex focus-ring py-1 px-2 text-decoration-none border rounded-2"  type="number" name="fatura1" id="fatura1" placeholder="Fatura 1"> 
        <br>
        <br>
        <input class="d-inline-flex focus-ring py-1 px-2 text-decoration-none border rounded-2" type="number" name="fatura2" id="fatura2" placeholder="Fatura 2">
        <br>
        <br>
        <input  class="d-inline-flex focus-ring py-1 px-2 text-decoration-none border rounded-2" type="number" name="fatura3" id="fatura3" placeholder="Fatura 3">
        <br>
        <br>
        <input class="d-inline-flex focus-ring py-1 px-2 text-decoration-none border rounded-2" type="number" name="fatura4" id="fatura4" placeholder="Fatura 4">
        <br>
        <br>
        <input  class="d-inline-flex focus-ring py-1 px-2 text-decoration-none border rounded-2" type="number" name="fatura5" id="fatura5" placeholder="Fatura 5">
        <br>
        <br>
        <input  class="btn btn-primary" type="button" value="somar" onclick="somase()">
        
        <br>
        <br>
        
        </div>
        
        
        <div id="resultadosoma"> 
        
        </div>
        
        <br>
        <br>
        
        <input class="d-inline-flex focus-ring py-1 px-2 text-decoration-none border rounded-2" type="number" name="desconto" id="desconto" placeholder="Porcentagem %">
        <input class="btn btn-primary" type="button" value="desconto" onclick="descontose()">
        <br>
        <br>
        
        
        <div id="resultadodesconto"> 
        
        </div>
        <br>
        <p>Bonificação R$ 30, 50 na fatura ou isenção</p>
        <p>Mudança de titular/endereço</p> 
            
          </div>
        </div>
        <div class="card">
          
          <div class="card-body">
            <h5 class="card-title">Gestão</h5>
            <br><br>

               <label>Descreva brevemente a solicitação do cliente:</label><br>
  <textarea rows="10" cols="80" id="resumoSolicitacao"></textarea><br><br>


          </div>
        </div>
      </div>


 

    <br><br>

    

   




    
   


</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
